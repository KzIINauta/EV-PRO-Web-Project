<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Pro - Inicio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="top-panel">
        <header>
            <div class="logo-placeholder" aria-hidden="true"></div>

            <nav class="nav-center">
                <a href="#" data-route="nav-inicio">INICIO</a>
                <a href="#" data-route="nav-productos">PRODUCTOS</a>
                <a href="#" data-route="nav-servicios">SERVICIOS</a>
                <a href="#" data-route="nav-marcas">MARCAS</a>
                <a href="#" data-route="nav-ofertas">OFERTAS</a>
                <a href="#" data-route="nav-contacto">CONTACTO</a>
            </nav>

            <div class="nav-right-container">
                <div class="nav-right-pill" data-route="nav-cuenta" role="button" tabindex="0">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span>MI CUENTA</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span data-route="nav-carrito">(0)</span>
                </div>
                <button class="btn-catalog" data-route="btn-catalog">VER CATALOGO COMPLETO &rarr;</button>
            </div>
        </header>

        <div class="hero-title">
            <h1>SUMERGETE EN EL SONIDO.</h1>
        </div>
    </div>

    <img
        class="decorative-products"
        src="Elementos Decorativo.png"
        alt="Productos de audio EV Pro"
        decoding="async"
        fetchpriority="high"
    >

    <div class="bottom-left">
        <strong>STOCK DISPONIBLE:</strong>
        Desde Estudios de<br>
        Grabación a Escenarios en Vivo:<br>
        Tenemos Lo Que Necesitas.
        <div class="dotted-line"></div>
    </div>

    <ul class="mid-right-links">
        <li>Aviso Legal <span>/01</span></li>
        <li>Política de Privacidad <span>/02</span></li>
        <li>Sobre Nosotros <span>/03</span></li>
    </ul>

    <div class="bottom-right">
        <button class="circle-btn" data-route="btn-prueba">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
            <span>Hacer prueba<br>de Sonido</span>
        </button>

        <div class="social-container">
            <div class="social-icons">
                <a href="#" data-social="instagram" aria-label="Instagram">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                </a>
                <a href="#" data-social="facebook" aria-label="Facebook">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                </a>
                <a href="#" data-social="whatsapp" aria-label="WhatsApp">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </a>
            </div>
            <p>Diseño realizado por Nauta</p>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
