<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Pro - Prueba de Sonido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .placeholder-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 24px;
        }
        .placeholder-wrap h2 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            margin-bottom: 12px;
            color: #fff;
        }
        .placeholder-wrap p { color: #8c897d; max-width: 520px; }
        .placeholder-wrap .back {
            margin-top: 24px;
            padding: 10px 22px;
            border: 1px solid #8c897d;
            border-radius: 40px;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            transition: background 0.3s, border-color 0.3s;
        }
        .placeholder-wrap .back:hover {
            background: var(--color-blue);
            border-color: var(--color-blue);
        }
    </style>
</head>
<body>
    <div class="placeholder-wrap">
        <h2>Prueba de Sonido</h2>
        <p>Próximamente: reproductor interactivo para probar el sonido EV Pro antes de comprar.</p>
        <a href="../index.html" class="back">&larr; Volver al inicio</a>
    </div>
</body>
</html>
